<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - VeriTruth Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0d6efd;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom px-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🛡️ VeriTruth Portal</a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm">Home Portal</a>
                <a href="admin.html" class="btn btn-light btn-sm text-primary fw-bold">Admin Console</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div id="profileAlert"></div>

                <div class="profile-card p-4 p-md-5">
                    <h3 class="fw-bold text-dark mb-4 border-bottom pb-2">Account Settings & Profile</h3>
                    
                    <form id="profileForm" onsubmit="saveProfile(event)">
                        
                        <!-- Profile Header & Picture Upload -->
                        <div class="d-flex align-items-center gap-4 mb-4 flex-wrap">
                            <img src="" alt="Profile Picture" class="profile-img" id="imgPreview">
                            <div>
                                <h4 class="fw-bold mb-1" id="dispUsername">User</h4>
                                <p class="text-muted mb-1" id="dispEmail">user@example.com</p>
                                <span class="badge bg-primary mb-2" id="dispRole">Standard User</span>
                                <div>
                                    <input type="file" id="profilePicInput" class="form-control form-control-sm" accept="image/*" onchange="previewImage(event)">
                                    <small class="text-muted">Upload profile photo (JPG, PNG, WEBP)</small>
                                </div>
                            </div>
                        </div>

                        <!-- User Info Form Fields -->
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address (Account Identifier)</label>
                                <input type="email" id="profEmail" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Age</label>
                                <input type="number" id="profAge" min="10" max="120" class="form-control" placeholder="Enter age">
                            </div>

                            <!-- Account Role Selector Dropdown -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Account Role</label>
                                <select id="profRole" class="form-select">
                                    <option value="Standard User">Standard User</option>
                                    <option value="Reporter">Reporter / Journalist</option>
                                    <option value="Moderator">Community Moderator</option>
                                    <option value="Fact Checker">Verified Fact Checker</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Address / Location</label>
                                <textarea id="profAddress" class="form-control" rows="3" placeholder="Enter city, state or address"></textarea>
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a href="index.html" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Changes</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle & DB Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="db.js"></script>

    <script>
        let selectedAvatarData = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadUserProfile();
        });

        function loadUserProfile() {
            let currentUser = DB.getCurrentUser();
            
            // If not logged in, fallback to first user in DB for demo purposes
            if (!currentUser) {
                const allUsers = DB.getUsers();
                if (allUsers.length > 0) {
                    currentUser = allUsers[0];
                    DB.setCurrentUser(currentUser);
                } else {
                    window.location.href = "index.html";
                    return;
                }
            }

            document.getElementById('dispUsername').innerText = currentUser.name;
            document.getElementById('dispEmail').innerText = currentUser.email;
            document.getElementById('dispRole').innerText = currentUser.role || 'Standard User';

            document.getElementById('profName').value = currentUser.name;
            document.getElementById('profEmail').value = currentUser.email;
            document.getElementById('profAge').value = currentUser.age || '';
            document.getElementById('profRole').value = currentUser.role || 'Standard User';
            document.getElementById('profAddress').value = currentUser.address || '';

            // Avatar Handling
            const imgPreview = document.getElementById('imgPreview');
            if (currentUser.profile_pic && currentUser.profile_pic.startsWith('data:image')) {
                imgPreview.src = currentUser.profile_pic;
            } else {
                imgPreview.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(currentUser.name) + "&background=0D8ABC&color=fff&size=150";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedAvatarData = e.target.result;
                    document.getElementById('imgPreview').src = selectedAvatarData;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfile(event) {
            event.preventDefault();

            const currentUser = DB.getCurrentUser();
            if (!currentUser) return;

            const name = document.getElementById('profName').value.trim();
            const age = document.getElementById('profAge').value;
            const role = document.getElementById('profRole').value;
            const address = document.getElementById('profAddress').value.trim();

            if (!name) {
                alert("Please enter a valid name.");
                return;
            }

            const updateData = {
                name: name,
                age: age,
                role: role,
                address: address
            };

            if (selectedAvatarData) {
                updateData.profile_pic = selectedAvatarData;
            }

            const result = DB.updateProfile(currentUser.id, updateData);

            if (result.status === 'success') {
                const alertBox = document.getElementById('profileAlert');
                alertBox.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <strong>Success:</strong> Profile updated successfully!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                loadUserProfile();
            }
        }
    </script>
</body>
</html>
